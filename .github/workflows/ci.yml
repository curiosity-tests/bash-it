            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  lint-differential:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      id-token: write

    steps:
    - name: Repository checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 0
        persist-credentials: false
    - id: shellcheck-range
      name: Resolve Differential ShellCheck range
      run: echo "base=$(git rev-parse HEAD~1)" >>"$GITHUB_OUTPUT"

    - id: ShellCheck
      name: Differential ShellCheck
      uses: redhat-plumbers-in-action/differential-shellcheck@d965e66ec0b3b2f821f75c8eff9b12442d9a7d1e   # v5.5.6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        triggering-event: push
        push-event-base: ${{ github.event.before || steps.shellcheck-range.outputs.base }}
        push-event-head: ${{ github.event.after || github.sha }}
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
